<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClipJournal</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="cover">
    <header class="bar">
      <div class="brand" title="ClipJournal">ClipJournal</div>

      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Search entries" autocomplete="off" spellcheck="false">
      </label>

      <div class="filters" id="filters" role="group" aria-label="Filter by color label"></div>

      <div class="bar-actions">
        <button class="tool" id="btn-capture" title="Add clipboard text (Alt+Shift+S)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="3.5" width="10" height="14" rx="1.5"/><path d="M8 3.5V2.5h4v1M10 8v6M7 11h6"/></svg>
        </button>
        <button class="tool" id="btn-write" title="Write a new entry (N)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5l3 3L8 15H5v-3z"/><path d="M11.5 5.5l3 3"/></svg>
        </button>
        <button class="tool" id="btn-settings" title="Settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="book" id="book">
      <section class="page left" id="page-left"></section>
      <div class="gutter" aria-hidden="true"></div>
      <section class="page right" id="page-right"></section>
      <div class="leaf" id="leaf" aria-hidden="true">
        <div class="face front"></div>
        <div class="face back"></div>
      </div>
      <button class="corner prev" id="prev" title="Previous pages (←)" aria-label="Previous pages"></button>
      <button class="corner next" id="next" title="Next pages (→)" aria-label="Next pages"></button>
      <div class="ribbon" aria-hidden="true"></div>
    </main>

    <!-- hidden page used to measure how many entries fit -->
    <div class="page measure" id="measure" aria-hidden="true"></div>
  </div>

  <!-- entry editor -->
  <div class="sheet-wrap" id="editor" hidden>
    <form class="sheet" id="editor-form" autocomplete="off">
      <h2 id="editor-heading">New entry</h2>
      <input class="title-input" id="ed-title" placeholder="Title (optional)" maxlength="120">
      <textarea id="ed-text" placeholder="Write or paste text…" required></textarea>
      <div class="row">
        <span class="row-label">Color</span>
        <div class="swatches" id="ed-labels"></div>
      </div>
      <div class="row">
        <label class="row-label" for="ed-tags">Tags</label>
        <input id="ed-tags" placeholder="work, email, snippets">
      </div>
      <div class="row">
        <span class="row-label">Slot</span>
        <div class="slot-pick" id="ed-slot"></div>
        <label class="pin-toggle"><input type="checkbox" id="ed-pinned"> Pin to front</label>
      </div>
      <p class="source" id="ed-source"></p>
      <div class="sheet-actions">
        <button type="button" class="link danger" id="ed-delete">Tear out</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="ed-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save <kbd>Ctrl ↵</kbd></button>
      </div>
    </form>
  </div>

  <!-- settings -->
  <div class="sheet-wrap" id="settings" hidden>
    <div class="sheet settings">
      <h2>Settings</h2>

      <h3>Shortcuts</h3>
      <div class="row">
        <label class="row-label wide" for="set-modifier">Quick-slot hotkeys</label>
        <select id="set-modifier">
          <option value="alt+shift">Alt + Shift + 1…0</option>
          <option value="ctrl+shift">Ctrl + Shift + 1…0</option>
          <option value="ctrl+alt">Ctrl + Alt + 1…0</option>
          <option value="alt">Alt + 1…0</option>
          <option value="off">Off (use browser shortcuts only)</option>
        </select>
      </div>
      <p class="hint">Works on regular web pages. To use slots everywhere (or change the capture / open keys) assign them in Chrome's shortcut page.</p>
      <div class="shortcut-list" id="shortcut-list"></div>
      <button class="btn" id="open-shortcuts">Open Chrome shortcut settings</button>

      <h3>Saving</h3>
      <label class="check"><input type="checkbox" id="set-autoslot"> Put new captures in the next empty quick slot</label>
      <label class="check"><input type="checkbox" id="set-dedupe"> Skip a capture identical to the latest entry</label>
      <div class="row">
        <label class="row-label wide" for="set-sort">Order entries by</label>
        <select id="set-sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>

      <h3>Color labels</h3>
      <div class="label-editor" id="label-editor"></div>

      <h3>Journal</h3>
      <div class="row buttons">
        <button class="btn" id="export">Export…</button>
        <label class="btn">Import…<input type="file" id="import" accept="application/json,.json" hidden></label>
        <span class="spacer"></span>
        <button class="link danger" id="clear-all">Empty journal</button>
      </div>

      <div class="sheet-actions">
        <span class="spacer"></span>
        <button class="btn primary" id="settings-done">Done</button>
      </div>
    </div>
  </div>

  <!-- delete confirmation -->
  <div class="sheet-wrap confirm-wrap" id="confirm" hidden>
    <div class="sheet confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
      <h2 id="confirm-title">Tear out this entry?</h2>
      <p id="confirm-msg"></p>
      <div class="sheet-actions">
        <span class="spacer"></span>
        <button class="btn" id="confirm-no">Cancel</button>
        <button class="btn danger" id="confirm-yes">Delete</button>
      </div>
    </div>
  </div>

  <!-- slot picker popover -->
  <div class="popover" id="slot-popover" hidden></div>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
